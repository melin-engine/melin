[package]
name = "melin-journal"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Durable write-ahead journal with CRC32C checksums, BLAKE3 hash chain, and snapshot framing"

[lints]
workspace = true

[lib]
name = "melin_journal"
path = "src/lib.rs"

[features]
default = ["hash-chain"]
## BLAKE3 tamper-evident hash chain, **on by default**. Hashes every
## journal entry into a per-segment chain anchored in the segment header
## and verified at segment boundaries and snapshot anchors. Catches
## deliberate tampering (CRC32C only catches corruption) and — more
## routinely — is what makes a divergent replica journal detectable at
## all: with it off, an ex-primary rejoining after failover with a
## journaled-but-unreplicated suffix is streamed to rather than resynced,
## silently forking the audit trail. Costs one incremental BLAKE3 update
## per entry on the journal stage, which runs parallel to matching. Turn
## off with `--no-default-features` only where no audit trail and no
## cross-node divergence detection are required.
hash-chain = ["dep:blake3"]
## Expose `test_utils` hooks used by consuming crates' tests — notably
## an in-process override for the prealloc chunk size, so recovery
## stress tests avoid the 256 MiB fallocate per iteration. Activate
## from `[dev-dependencies]` only; production builds must leave this off.
test-utils = []

[dependencies]
blake3 = { version = "1", optional = true }
crc32c = "0.6"
getrandom = "0.4"
libc = { workspace = true }
# Safe wrappers for `pwrite`, `pwritev2`, `fallocate` so the journal hot
# path can drop the corresponding `unsafe { libc::… }` blocks. Already
# transitively in the workspace dep tree.
rustix = { version = "1", features = ["fs"] }
tracing = { workspace = true }
# Typed views over raw byte buffers for the on-disk frame layout —
# replaces field-by-field le::put / le::get chains with single struct
# read/writes. derive feature for `FromBytes` / `IntoBytes`.
zerocopy = { version = "0.8", features = ["derive", "alloc"] }
melin-app = { workspace = true }
melin-pipeline = { workspace = true }
memmap2 = "0.9.10"

[dev-dependencies]
tempfile = "3"
