[package]
name = "melin-raft"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Control-plane consensus: leader election, membership, and fencing epochs on openraft"

[lints]
workspace = true

[lib]
name = "melin_raft"
path = "src/lib.rs"

[dependencies]
# Control-plane consensus engine. Pinned to the 0.9 stable line (0.10 is
# alpha). Feature choices are load-bearing:
#   - `single-term-leader`: standard-Raft leader IDs — at most one leader
#     per term, terms strictly increase per leader tenure. The
#     term-mints-fencing-epoch design depends on this; the default mode
#     allows two leaders to share a term.
#   - `serde`: serializable RPC/log types for our postcard wire format.
#   - `storage-v2`: the split RaftLogStorage/RaftStateMachine traits.
# `QUORUM_ACK_MAX_AGE` (driver.rs) relies on the follower-lease semantics
# read in 0.9.25 (`Engine::handle_vote_req`, `EngineConfig::new`), and
# `LEADER_CONFIRM_TIMEOUT` (driver.rs) on `Raft::get_read_log_id`'s
# behaviour there (`RaftCore::handle_check_is_leader_request`: one
# heartbeat per voter under a `heartbeat_interval` timeout, the vote and
# read log id captured before sending); both must be re-derived on any
# upgrade (0.10 changes elections). Not pinned
# exactly: an `=` pin in a published library makes resolution brittle for
# a consumer that also depends on openraft 0.9. `Cargo.lock` holds 0.9.25
# for our builds, and the election test
# `a_leader_that_loses_both_peers_keeps_leading_and_its_ack_ages` fails if
# a release adds check-quorum or stops ageing the ack.
openraft = { version = "0.9", features = ["serde", "single-term-leader", "storage-v2"] }
# Current-thread runtime confined to the single raft-driver thread —
# openraft requires an async runtime; the data plane stays synchronous.
# openraft already pulls every feature here except `net`.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
# Wire/storage serialization. Postcard over bincode: compact varint
# encoding, and no encoder/decoder configuration knobs (fixint vs varint,
# endianness, limits) that can silently diverge between peers.
# `default-features = false` drops postcard's default `heapless-cas`, which
# exists to serialize into a fixed-capacity `heapless::Vec` for no_std
# targets. Only `to_stdvec`/`from_bytes` are used here, so the feature buys
# nothing and costs a dependency subtree — heapless 0.7 pulls the archived
# `atomic-polyfill` (RUSTSEC-2023-0089), which has no fixed version.
postcard = { version = "1", default-features = false, features = ["use-std"] }
crc32c = "0.6"
ed25519-dalek = { workspace = true }
getrandom = "0.4"
tracing = { workspace = true }
melin-app = { workspace = true }
melin-transport-core = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
tempfile = "3"
proptest = "1"
# Re-pull melin-transport-core with `test-utils` for the race-safe
# localhost port allocator (`test_ports::free_addr`).
melin-transport-core = { workspace = true, features = ["test-utils"] }
