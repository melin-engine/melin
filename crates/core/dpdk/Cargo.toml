[package]
name = "melin-dpdk"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "DPDK kernel-bypass transport using userspace poll-mode drivers and smoltcp TCP/IP"

[lints]
workspace = true

[features]
default = []
# Enable when libdpdk is installed. Without this feature the crate
# compiles as an empty shell — no bindgen, no C compilation, no linking.
dpdk-sys = ["dep:libc", "dep:bindgen", "dep:pkg-config", "dep:cc"]

[dependencies]
# Userspace TCP/IP stack — replaces the kernel TCP stack when using DPDK.
# `std` feature needed for smoltcp to link against system time; `medium-ethernet`
# for Ethernet frame processing; `proto-ipv4` + `socket-tcp` for TCP/IPv4.
#
# `fastcp` is our smoltcp fork, now published to crates.io: 0.13.1 is the
# release of the branch this crate used to track, so it carries the
# zero-copy RX window bound, the descriptor-capacity ordering fix and
# `Interface::forget_tcp_socket`. Back on the registry the workspace's
# source policy (`deny.toml`: no git dependencies) holds again.
smoltcp = { package = "fastcp", version = "0.13.1", default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-tcp-zero-copy-rx",
    "log",
    # 8 entries by default; a missing neighbour silences the socket for the
    # discovery timeout, so a deployment whose peers span more hosts than that
    # stalls for seconds at a time.
    "iface-neighbor-cache-count-64",
] }
tracing = "0.1"
libc = { version = "0.2", optional = true }
# FxHash: low-cost hasher for integer-keyed maps on the hot path.
rustc-hash = "2"

[build-dependencies]
# bindgen generates Rust FFI bindings from DPDK C headers at build time.
# Requires DPDK to be installed (pkg-config --cflags --libs libdpdk).
bindgen = { version = "0.72", optional = true }
pkg-config = { version = "0.3", optional = true }
# cc compiles the C wrapper functions for DPDK inline functions.
cc = { version = "1", optional = true }
