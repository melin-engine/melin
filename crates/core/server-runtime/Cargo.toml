[package]
name = "melin-server-runtime"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Application-agnostic server runtime with accept loop, journaling, replication, and optional DPDK transport"

[lints]
workspace = true

[features]
default = ["hash-chain"]
## Compile out debug! and trace! at build time. Eliminates the tracing
## filter check (~5-10 ns) on every call site in the hot path.
release-tracing = ["tracing/max_level_info"]
no-persist = ["melin-transport-core/no-persist"]
## Lightweight per-stage histograms.
latency-trace = [
    "melin-transport-core/latency-trace",
]
## Full tick-to-trade decomposition. Implies latency-trace.
tick-to-trade = ["latency-trace"]
## Kept for backward compatibility — io_uring is now always used.
io-uring = []
## DPDK userspace TCP transport.
dpdk = ["dep:melin-dpdk", "melin-dpdk/dpdk-sys"]
pipeline-stats = ["melin-transport-core/pipeline-stats"]
## Tamper-evident BLAKE3 journal chain and the cross-node divergence
## checks built on it (handshake, rotation boundary, periodic ChainCheck).
## On by default; both halves are switched together because a node with
## only one of them verifies nothing.
hash-chain = [
    "melin-journal/hash-chain",
    "melin-transport-core/hash-chain",
]

[dependencies]
melin-app = { workspace = true }
melin-pipeline = { workspace = true }
melin-journal = { workspace = true }
melin-wire-protocol = { workspace = true }
melin-transport-core = { workspace = true }
melin-raft = { workspace = true }
blake3 = "1"
base64 = { workspace = true }
clap = { workspace = true }
crc32c = "0.6"
ed25519-dalek = { workspace = true }
getrandom = "0.4"
io-uring = "0.7"
libc = { workspace = true }
rand = { workspace = true }
rustc-hash = "2"
tracing = { workspace = true }
zerocopy = { version = "0.8", features = ["derive"] }
melin-dpdk = { workspace = true, optional = true }

[dev-dependencies]
# The runtime's library API is application-agnostic. Tests that need a
# concrete `Application`/`AppEvent` to instantiate the generic pipeline
# (replication wire format, DPDK frame fixtures) use the in-tree counter
# example rather than any exchange crate — this keeps the core dependency
# graph free of exchange coupling. Auth-handshake tests build their wire
# frames directly from `melin-wire-protocol::control_codec` (already a
# normal dependency), the same path the runtime itself uses.
#
# Path-only (no version), and deliberately NOT inherited from
# `[workspace.dependencies]`: `melin-example-counter` is `publish = false`,
# so it must not carry a version requirement, and `cargo publish` strips
# version-less dev-dependencies. This is a dev-only dependency cycle
# (counter depends on the runtime), which Cargo permits. The counter's own
# package version tracks the workspace, but that is unrelated — declaring a
# version requirement here would break `cargo publish` for this crate.
melin-example-counter = { path = "../../examples/counter" }
tempfile = "3"
serial_test = "3"
proptest = "1"
melin-journal = { workspace = true, features = ["test-utils"] }
# Opt-in (RUST_LOG-gated) diagnostics for the multi-node failover tests:
# election livelocks only reproduce statistically, and the panic-time
# metrics snapshot alone cannot show the vote traffic that led there.
tracing-subscriber = { workspace = true }
melin-transport-core = { workspace = true, features = ["test-utils"] }
