[package]
name = "melin-test-node"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Test support: start nodes on kernel TCP, or on DPDK under the netns runner, from one entry point."
# Test support only, pulled in as a dev-dependency: never shipped, and
# kept out of every production build. A crate rather than a feature of
# `melin-server-runtime` so that the runtime's own integration tests can
# use it too (a dev-dependency cycle, as with `melin-example-counter`),
# without a test-only switch on a published crate. Version-less in its
# dependents for the same reason as the counter: see the root manifest.
publish = false

[lints]
workspace = true

[dependencies]
melin-app = { workspace = true }
# Pulled without default features (see the root manifest): whether the
# journal carries the hash chain is the test crate's choice, made through
# its own dependency on the runtime, not this crate's.
melin-server-runtime = { workspace = true }
melin-wire-protocol = { workspace = true }
# Only the DPDK side needs these: the process-wide EAL and the per-node
# devices on it, and the CPU set for EAL's lcore.
melin-dpdk = { workspace = true, optional = true, features = ["dpdk-sys"] }
libc = { workspace = true, optional = true }

[features]
## Start nodes on the DPDK transport, on the network
## `scripts/dpdk/netns-runner.sh` builds. Needs libdpdk to build.
dpdk = ["melin-server-runtime/dpdk", "dep:melin-dpdk", "dep:libc"]

# Two NIC groups on one EAL the process owns, under the netns runner (see
# the file). Needs libdpdk and the runner, so only with `dpdk`.
[[test]]
name = "nic_groups"
path = "tests/nic_groups.rs"
required-features = ["dpdk"]

# Replication on a queue of its own refused on a NIC that cannot steer,
# under the netns runner (see the file). Only with `dpdk`, as above.
[[test]]
name = "queue_split"
path = "tests/queue_split.rs"
required-features = ["dpdk"]

# The replication split refused on a port with one queue pair, under the
# netns runner (see the file). Only with `dpdk`, as above.
[[test]]
name = "queue_split_one_queue"
path = "tests/queue_split_one_queue.rs"
required-features = ["dpdk"]

# A node's NICs in shared mode, one group, and a poll thread registered
# with its EAL, under the netns runner (see the file). Only with `dpdk`,
# as above.
[[test]]
name = "nic_groups_shared"
path = "tests/nic_groups_shared.rs"
required-features = ["dpdk"]

# A replication NIC that fails to come up after the client NIC has, under
# the netns runner (see the file). Only with `dpdk`, as above.
[[test]]
name = "nic_groups_replication_fails"
path = "tests/nic_groups_replication_fails.rs"
required-features = ["dpdk"]
