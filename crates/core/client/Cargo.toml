[package]
name = "melin-client"
version.workspace = true
edition = "2024"
rust-version.workspace = true
# Apache-2.0 rather than the workspace's BSL, like the examples: this is
# the code a customer links into their own client binaries and copies
# from, so the runtime's licence must not travel with it. The crate's
# LICENSE file is the Apache text, not the root BSL, and the release
# tooling leaves it alone.
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Client for a Melin node: framing, Ed25519 authentication, and the request/response batch protocol, blocking, polled or I/O-free"

[lints]
workspace = true

[dependencies]
# The wire layer proper: frame reader/writer, control tags, and the
# challenge-response codec. The client adds the client side of the
# conversation on top, nothing of the wire format itself.
melin-wire-protocol = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
# The client NIC handle, for the polled connection over kernel bypass:
# behind the `dpdk` feature only. melin-dpdk is BUSL-1.1, and this crate
# is Apache-2.0 so that the runtime's licence does not travel with it. A
# BSL dependency is acceptable here because it is optional and off by
# default: without the feature nothing of melin-dpdk is compiled or
# linked, and a customer who turns it on has chosen to link the runtime's
# licence into that binary. deny.toml passes it unchanged, since its BSL
# exception is granted per crate name and melin-dpdk already has one.
melin-dpdk = { workspace = true, optional = true }

[features]
default = []
# The polled connection over DPDK: `StreamConnection::connect_dpdk`, the
# NIC handle's stream as a `ByteStream`, the NIC configuration re-exported.
# Links melin-dpdk (BUSL-1.1, see above) and needs libdpdk to build, like
# `melin-shm-proxy/dpdk`.
dpdk = ["dep:melin-dpdk", "melin-dpdk/dpdk-sys"]

[dev-dependencies]
# One test needs a port that refuses connections for as long as it runs.
# A socket bound but never listened on does that and keeps the port,
# where a port merely freed can be taken by another test process before
# the connect. `std::net` cannot bind without listening; socket2 can.
socket2 = "0.6"
# Round-trips arbitrary runs of framed requests through the decoder.
proptest = "1"
