[package]
name = "melin-example-counter"
version.workspace = true
edition = "2024"
rust-version.workspace = true
# Apache-2.0 rather than the workspace's BSL: examples exist to be copied
# into an application, and the runtime's licence should not travel with
# the copied lines. The crate's LICENSE file is the Apache text, not the
# root BSL, and the release tooling leaves it alone.
license = "Apache-2.0"
description = "Minimal example: a durable, replicated counter built on the Melin core runtime."
# Not publishable, and not just by policy: this crate and
# `melin-server-runtime` form a dev-dependency cycle (the runtime's tests
# use the counter as a concrete `Application`). Cargo permits the cycle
# only because it is never published. Inheriting the workspace version
# keeps the example labelled with the runtime release it demonstrates; it
# does not make the crate publishable.
publish = false

[lints]
workspace = true

[lib]
name = "counter_server"
path = "src/lib.rs"

[[bin]]
name = "counter-server"
path = "src/main.rs"

[dependencies]
melin-app = { workspace = true }
melin-server-runtime = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
melin-wire-protocol = { workspace = true }
tempfile = "3"

[features]
default = ["hash-chain"]
# A pure forward: the runtime is pulled with `default-features = false`
# (see the root Cargo.toml), so the reference application has to switch
# the chain itself, the way a real deployment's crate does. On by default
# for the same reason the runtime's is.
hash-chain = ["melin-server-runtime/hash-chain"]
