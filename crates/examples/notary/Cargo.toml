[package]
name = "melin-example-notary"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Variable-payload example: an echo and a tamper-evident notary built on the Melin core runtime."
# Not publishable, for the same reason as `melin-example-counter`: examples
# depend on `melin-server-runtime` and the runtime's tests depend back on
# them. Cargo permits the dev-dependency cycle only for unpublished crates.
publish = false

[lints]
workspace = true

[lib]
name = "notary_server"
path = "src/lib.rs"

[[bin]]
name = "notary-server"
path = "src/main.rs"

[dependencies]
melin-app = { workspace = true }
melin-server-runtime = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
melin-wire-protocol = { workspace = true }
# Only for the footprint and journal-limit tests: this example's payload
# width is the dominant term in every pipeline slot and sits just under a
# hard journal entry cap, so both costs are asserted rather than left to
# be discovered on a benchmark run.
melin-transport-core = { workspace = true }
melin-journal = { workspace = true }
tempfile = "3"

[features]
default = []
hash-chain = ["melin-server-runtime/hash-chain"]
