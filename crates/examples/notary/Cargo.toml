[package]
name = "melin-example-notary"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Tamper-evident notary example: a BLAKE3 hash chain over client-submitted digests, built on the Melin core runtime."
# Not publishable, like `melin-example-counter`: examples demonstrate the
# runtime and are not shipped as crates. (Unlike the counter, nothing in
# the runtime depends back on this crate — the policy alone applies.)
publish = false

[lints]
workspace = true

[lib]
name = "notary_server"
path = "src/lib.rs"

[[bin]]
name = "notary-server"
path = "src/main.rs"

[dependencies]
melin-app = { workspace = true }
# `hash-chain` is required rather than optional: a notary's own journal
# must be tamper-evident. (Being a workspace member, this also turns the
# feature on in every workspace-wide build — resolver 3 unifies features.)
melin-server-runtime = { workspace = true, features = ["hash-chain"] }
blake3 = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
melin-wire-protocol = { workspace = true }
# Only for the footprint and journal-limit tests: the event width this
# example commits to is what keeps ring slots and the fsync batch at the
# size the pipeline was tuned for, so both are asserted rather than left
# to be discovered on a benchmark run.
melin-transport-core = { workspace = true }
melin-journal = { workspace = true }
tempfile = "3"
