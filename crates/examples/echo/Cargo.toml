[package]
name = "melin-example-echo"
version.workspace = true
edition = "2024"
rust-version.workspace = true
# Apache-2.0 rather than the workspace's BSL: examples exist to be copied
# into an application, and the runtime's licence should not travel with
# the copied lines. The crate's LICENSE file is the Apache text, not the
# root BSL, and the release tooling leaves it alone.
license = "Apache-2.0"
description = "Echo example: the smallest application on the Melin core runtime, and the sequencer's latency floor."
# Not publishable, like the other examples: they demonstrate the runtime
# and are not shipped as crates.
publish = false

[lints]
workspace = true

[lib]
name = "echo_server"
path = "src/lib.rs"

[[bin]]
name = "echo-server"
path = "src/main.rs"

# Sends payloads in a closed loop and reports the round-trip latency
# distribution. What a user of the floor runs; the server is what an
# operator runs.
[[bin]]
name = "echo-client"
path = "src/client.rs"

# Drives a chosen rate on one connection and writes the round-trip
# distribution as an HdrHistogram log, shaped like the Aeron benchmark
# harness so the two sit side by side. Kernel TCP by default; the `dpdk`
# feature adds the kernel-bypass transport.
[[bin]]
name = "echo-bench"
path = "src/bench.rs"

[dependencies]
melin-app = { workspace = true }
melin-server-runtime = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }
# The client's side of the wire: control-frame tags and Ed25519 auth.
melin-wire-protocol = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
# echo-bench records every sample into an HdrHistogram and writes the
# interval-log format the Aeron benchmark tooling reads. `serialization`
# is that writer; the `sync` default is a channel-backed recorder for
# multi-threaded producers, which a single-threaded loop has no use for.
hdrhistogram = { version = "7", default-features = false, features = ["serialization"] }
# The kernel-bypass transport, behind the `dpdk` feature: the NIC through
# DPDK's poll-mode driver and TCP in userspace via the sequencer's smoltcp
# fork. Both are what the server uses on that path.
melin-dpdk = { workspace = true, optional = true }
smoltcp = { package = "fastcp", version = "0.13", default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
], optional = true }

[dev-dependencies]
# The tests read the journal back to check what was — and was not —
# written, and the sizing tests take the ring and batch constants from
# the transport.
melin-journal = { workspace = true }
melin-transport-core = { workspace = true }
tempfile = "3"

[features]
default = ["hash-chain"]
# A pure forward, as in the counter: the runtime is pulled with
# `default-features = false` (see the root Cargo.toml), so the crate
# switches the chain itself. On by default because a deployment's is;
# `--no-default-features` is the chain-less floor.
hash-chain = ["melin-server-runtime/hash-chain"]
# echo-bench over DPDK. Needs libdpdk at build time, like the server's own
# `melin-server-runtime/dpdk`; without the feature the binary still builds
# and runs over kernel TCP.
dpdk = ["dep:melin-dpdk", "melin-dpdk/dpdk-sys", "dep:smoltcp"]
