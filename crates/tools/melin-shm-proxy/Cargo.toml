[package]
name = "melin-shm-proxy"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "A sidecar that holds one connection to a Melin node, over kernel TCP or DPDK, and offers it to a client in another process through shared memory."
# A tool, not a library anyone links: the clients it serves speak to it
# through a mapped file. Not published until it has a second user beyond
# the benchmark harness; publishing it needs a `deny.toml` exception and
# a crates.io release of `melin-dpdk` at the same version.
publish = false

[lints]
workspace = true

[[bin]]
name = "shm-proxy"
path = "src/main.rs"

[dependencies]
# Core pinning, and the clock the trace's calibration anchors to.
melin-app = { workspace = true }
# The protocol's tags and request IDs, which are all the proxy ever reads
# of the bytes it carries (and only on `--trace`): a request on the way
# out, the final frame naming it on the way back. Nothing of any
# application.
melin-wire-protocol = { workspace = true }
clap = { workspace = true }
# The link is a file mapped with mmap; nothing in std exposes that.
libc = { workspace = true }
# `--trace` percentiles.
hdrhistogram = "7"
# The kernel-bypass transport, behind the `dpdk` feature: the client NIC
# handle, the node's own DPDK transport dialing out. Its API is std types
# only, so the proxy needs no TCP stack of its own. `clap` for the
# `--dpdk-*` flags, which are the node's own declaration.
melin-dpdk = { workspace = true, optional = true, features = ["clap"] }

[dev-dependencies]
tempfile = "3"
# The trace's frame scanner, fed the same frames in random pieces.
proptest = "1"
# The DPDK bridge test (`tests/dpdk_bridge.rs`): an echo node on DPDK,
# started through the launcher under the netns runner, for the binary to
# dial. Path-only, like every crate's dev-dependency on the launcher and
# the examples: both are `publish = false`.
melin-test-node = { path = "../../core/test-node" }
melin-example-echo = { path = "../../examples/echo" }
melin-server-runtime = { workspace = true }
# The test's own client on the far side of the rings speaks the protocol
# with the client crate's I/O-free pieces, as the Java rig does with its
# own. A dev-dependency only: the binary depends on no client crate.
melin-client = { workspace = true }

[features]
default = []
# `--transport dpdk`. Needs libdpdk to build, like `melin-server-runtime/dpdk`;
# without the feature the binary still builds and runs over kernel TCP.
# The launcher's and the echo example's `dpdk` too, for the bridge test's
# node (dev-dependencies, so the binary's build is unchanged).
dpdk = ["dep:melin-dpdk", "melin-dpdk/dpdk-sys", "melin-test-node/dpdk", "melin-example-echo/dpdk"]

# Runs the binary over DPDK against a node on DPDK, so only with the
# feature, and only under `scripts/dpdk/netns-runner.sh`.
[[test]]
name = "dpdk_bridge"
required-features = ["dpdk"]
