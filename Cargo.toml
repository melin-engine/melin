[workspace]
# Explicit subtrees rather than `crates/*/*`: leftover ignored files from
# other branches (e.g. the exchange branch's proptest-regressions cache)
# can leave stray directories under crates/ that a bare glob would pick up.
members = ["crates/core/*", "crates/examples/*"]
resolver = "3"

[workspace.package]
# Single source of truth for the release version — every member inherits it
# via `version.workspace = true`. Bumping a release means editing this line
# plus the `melin-*` pins in `[workspace.dependencies]` below, all in this
# file. Keep the two in lockstep: a member's inherited version and the
# version requirement its dependents resolve against must always match.
version = "0.15.0"
# Minimum supported Rust version, inherited by every member via
# `rust-version.workspace = true` and enforced by the post-merge `msrv`
# CI job on every push to main — a declared-but-untested MSRV silently rots
# the first time a new std API lands. 1.91 is the floor `fastcp` (our
# smoltcp fork, via `melin-dpdk`) already declares on crates.io; the
# next-highest floor in the graph is 1.88 (`validit`, via openraft).
# Policy: bumping this is a breaking-ish change — minor release only,
# called out in the changelog, and the version chosen must be at least
# ~6 months old at the time.
rust-version = "1.91"
# SPDX identifier only. `license-file` is deliberately absent: setting both
# makes cargo warn ("only one of `license` or `license-file` is necessary")
# on every invocation, for every member.
#
# Dropping it means cargo no longer copies the root LICENSE into each
# published crate, so every member carries its own copy instead — cargo
# includes files under a package root automatically. BSL requires the
# licence to be displayed on each copy of the Licensed Work, so a published
# crate without the text (and without its Licensor / Change Date block)
# would not satisfy our own terms.
#
# Those copies must stay identical to the root LICENSE. Stamping the Change
# Date means rewriting every one of them; that belongs in the release
# tooling, not in a manual edit. The examples under `crates/examples` are
# the exception: they override this with Apache-2.0 (see their manifests)
# and carry that text instead, so the tooling skips them.
license = "BUSL-1.1"
repository = "https://github.com/melin-engine/melin"
homepage = "https://github.com/melin-engine/melin"
authors = ["P.L.S.C."]

[workspace.dependencies]
# Intra-workspace crates. `path` is resolved from the workspace root (not
# the member), and `version` is what dependents get on crates.io — path is
# used for local builds, the version requirement for published ones. Both
# must be carried here so `cargo publish` accepts the member manifests.
#
# `melin-example-counter` is deliberately absent: it is `publish = false`
# and must stay version-less. See the dev-dependency note in
# crates/core/server-runtime/Cargo.toml.
#
# The three crates that carry the `hash-chain` feature are pulled with
# `default-features = false`: a dependent states which half of the chain
# it wants through its own feature rather than inheriting it. That keeps
# `--no-default-features` a true off switch (otherwise a dependent built
# without the feature would still drag melin-journal's default in and
# compute a chain nothing publishes) and makes the half-configured
# combinations unreachable. Dependents that want the chain — every
# deployable one — get it from their own `default = ["hash-chain"]`.
melin-app = { path = "crates/core/app", version = "0.15.0" }
melin-dpdk = { path = "crates/core/dpdk", version = "0.15.0" }
melin-journal = { path = "crates/core/journal", version = "0.15.0", default-features = false }
melin-pipeline = { path = "crates/core/pipeline", version = "0.15.0" }
melin-raft = { path = "crates/core/raft", version = "0.15.0" }
melin-server-runtime = { path = "crates/core/server-runtime", version = "0.15.0", default-features = false }
melin-transport-core = { path = "crates/core/transport-core", version = "0.15.0", default-features = false }
melin-wire-protocol = { path = "crates/core/wire-protocol", version = "0.15.0" }

base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
libc = "0.2"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Lints every member inherits via `[lints] workspace = true`.
#
# `unused` is denied rather than warned because the warnings it catches
# are invisible in the configuration people actually build. An item whose
# only users sit behind `#[cfg(not(feature = "no-persist"))]` becomes dead
# code *only* in that configuration — the default build stays clean, the
# pre-commit hook's `cargo clippy -D warnings` never sees it (it lints
# default features), and the feature steps run `cargo check`, which warns
# and exits 0. Denying here moves the failure into the compiler itself, so
# every command in every configuration agrees without the hook and CI
# having to be kept in lockstep about it.
#
# Deliberately narrower than `warnings = "deny"`: a blanket deny hands
# every future rustc release the power to break this build on a new
# deprecation. `unused` is a stable group that rarely gains surprising
# members, and it covers the class that hides behind feature gates.
[workspace.lints.rust]
unused = "deny"

[profile.release]
# Full cross-crate LTO: allows LLVM to inline across crate boundaries
# (e.g., disruptor ring ops into engine hot path). Major win for multi-crate
# workspaces. Cost: slower release builds.
lto = "fat"
# Single codegen unit: LLVM optimizes the entire crate as one compilation
# unit instead of splitting into parallel chunks. Pairs with LTO for
# maximum cross-function optimization.
codegen-units = 1
# Abort on panic: eliminates unwind tables and landing pads. Smaller
# binaries, no unwind overhead at call boundaries. Safe here because
# pipeline threads don't use catch_unwind.
panic = "abort"

# Compile dependencies with optimizations even in debug mode. Makes
# `cargo test` (especially proptests) run much faster without slowing
# down the edit-compile-debug cycle for our own code.
[profile.dev.package."*"]
opt-level = 2

