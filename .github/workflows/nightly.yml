name: Nightly

# Checks that do not belong on every push — either because they are far
# too slow, or because they go red without anyone committing anything
# (upstream toolchain changes, newly published advisories).
#
# Scheduled runs only ever execute on the default branch, and
# `workflow_dispatch` does not appear in the UI until the file is on the
# default branch — so changes here cannot be exercised on a branch. To test
# a change, add `push:` scoped to your branch temporarily, then take it out
# before merging.
#
# The cron is deliberately not on the hour: `schedule` is delayed under
# load, and load peaks at :00 because every naive cron says `0`. Times are
# UTC, so 03:17 UTC is early morning in Europe — a failure is waiting when
# the day starts rather than landing mid-afternoon.
#
# Watch out: GitHub disables scheduled workflows on a public repository
# after 60 days with no repository activity, and a quiet stretch between
# releases is realistic here. It re-enables with one click, but the failure
# mode is silence, not an error.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same reasoning as the Pre-merge workflow: `.cargo/config.toml` asks for
  # `-C target-cpu=native` and `-fuse-ld=lld`, neither of which suits a
  # hosted runner. Miri interprets rather than links, but cargo still builds
  # build scripts and proc macros natively, so the override is still needed.
  RUSTFLAGS: -C target-cpu=x86-64-v2

jobs:
  miri:
    runs-on: ubuntu-latest
    # A shard runs two seeds against a measured 8-minute baseline, so it
    # should land near 16 minutes. The limit is here to fail rather than
    # hang if Miri hits something pathological under one interleaving.
    timeout-minutes: 60

    strategy:
      # One shard finding a bug must not cancel the other: which
      # interleaving breaks is the information being bought, and a
      # cancelled sibling reports nothing.
      fail-fast: false
      matrix:
        # Deliberately small to start. Sharding rather than one `0..4`
        # sweep halves the wall clock and names the range a failure came
        # from; widen the ranges or add shards once the cost of a real
        # nightly run is known. Concurrency allows 20 jobs.
        seeds: ["0..2", "2..4"]

    env:
      MIRI_SEEDS: ${{ matrix.seeds }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      # Deliberately no `Swatinem/rust-cache`. Cache storage is 10 GB per
      # repository with LRU eviction, and this workspace builds dependencies
      # at opt-level 2 even in dev, so a Miri cache entry would be large
      # enough to evict the Pre-merge entries that people actually wait on.
      # Nobody is waiting on a nightly.

      # MIRI_SEEDS comes from the matrix. Re-running each test under several
      # scheduler seeds is the point of running Miri nightly rather than on
      # every push: a single interleaving misses exactly the ordering bugs
      # this lock-free code can hide, and the sweep is far too slow to gate a
      # commit on. Baseline with no sweep measured 8 minutes on this runner.
      - name: Miri
        run: scripts/miri.sh
