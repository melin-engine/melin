name: Pre-merge

# The gate every change passes. Named for when it runs rather than what it
# contains, so it stays accurate as checks are added; longer-running work
# belongs in a Nightly workflow and release verification in a Release one.
#
# The checks here are the same ones `.githooks/pre-commit` runs locally.
# The hook is still the faster gate — it catches these before a commit
# exists — but it is opt-in (`git config core.hooksPath .githooks`) and
# invisible to anyone reading the repository, which is what this is for.
#
# Public repositories get standard hosted runners free and unmetered, so
# this costs nothing to run on every push.

on:
  push:
    # Skip pushes that only touch content no job reads: documentation, the
    # opt-in local hook, and repo housekeeping. Nothing in the workspace
    # `include_str!`s a markdown file and no crate directory holds a README
    # for cargo to package, so the prose here cannot affect a build.
    #
    # Files are named rather than globbed (no `**.md`, no `**/LICENSE`) so
    # that a file CI *does* read cannot silently fall into this list later.
    # `CHANGELOG.md` is already one: the packaging dry run below fails when
    # the version being published has no entry in it, so a `**.md` glob
    # would skip that check on exactly the pushes that change its input.
    # Every crate's `LICENSE` ships inside its own tarball, which is the
    # same trap one step further away.
    #
    # Anything a job *does* read stays in scope — `.cargo/` (rustflags),
    # `.config/` (nextest), `clippy.toml`, `deny.toml`, and `scripts/`.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CLA.md"
      - "CLAUDE.md"
      - ".githooks/**"
      - ".gitignore"
      - "signatures/**"
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: pre-merge-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` is tuned for the dev box: `-C target-cpu=native`
  # and `-fuse-ld=lld`. A `RUSTFLAGS` value in the environment *replaces*
  # `build.rustflags` wholesale rather than appending, which is exactly what
  # is wanted here — the runner image may not carry lld, and native codegen
  # buys nothing on a shared runner we do not benchmark on. Safe because no
  # code in the workspace uses target-specific intrinsics or `target_feature`
  # gates; x86-64-v2 is a floor every hosted runner generation clears.
  RUSTFLAGS: -C target-cpu=x86-64-v2

# Separate jobs rather than one so a failure in one does not hide the
# others: jobs are independent by default, so each reports its own verdict.
# They also run concurrently, so wall clock is the slowest job rather than
# the sum.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The hook's Cargo.lock check guards against committing a manifest
      # change without its lockfile. The CI equivalent is whether the
      # committed lockfile still resolves the workspace unchanged.
      #
      # Every cargo step below also passes `--locked`, so this one is not the
      # only thing asserting it — but it is the fastest and the one that says
      # so by name, which beats a ten-minute build failing on a flag.
      - name: Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      # `cargo fmt` neither builds nor resolves, so `--locked` does not apply.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    # The cluster tests are serialized to one at a time
    # (`.config/nextest.toml`), so the tail is long on 4 vCPUs. Generous
    # enough to finish, tight enough to fail rather than hang for six hours.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Official prebuilt binary — avoids a ~2 minute source build of
      # cargo-nextest on every run.
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # Off-by-default features that no other step builds. `hash-chain` is a
      # production durability feature (the tamper-evident audit chain) and
      # sat broken for a full release once because nothing enabled it.
      - name: hash-chain builds
        run: |
          for pkg in melin-journal melin-transport-core melin-server-runtime melin-example-counter; do
            cargo check -p "$pkg" --all-targets --features hash-chain --locked
          done

      # no-persist needs a real test run, not a build check: its last
      # regression was a recovery test recovering from a journal the mode
      # never writes. It compiled fine.
      - name: no-persist tests (transport-core)
        run: cargo test -q -p melin-transport-core --features no-persist --locked

      - name: no-persist builds (server-runtime)
        run: cargo check -p melin-server-runtime --all-targets --features no-persist --locked

      # `--no-fail-fast` so one flaky cluster test cannot hide the verdict on
      # the other 686. Costs nothing when the suite is green.
      - name: Tests
        run: cargo nextest run --no-fail-fast --locked

  # The one job that is two checks, because they share one apt install. Both
  # need the DPDK SDK, and apt is what rust-cache does not cover — it caches
  # cargo's registry and target directory, and every run starts on a fresh
  # VM, so a second job would pay for the SDK a second time. Sharing costs
  # the property the rest of this file relies on, that a failure in one check
  # cannot hide another, so the second step carries `if: ${{ !cancelled() }}`
  # to buy it back: it runs and reports whatever the first one did.
  #
  # The DPDK transport is the one configuration nothing else compiles. The
  # pre-commit hook cannot cover it: `melin-dpdk`'s build script hard-fails
  # when pkg-config cannot find libdpdk, so building it unconditionally
  # would break every commit on a machine without the SDK. That left the
  # feature compiled by nothing automatic, on any machine.
  #
  # Ubuntu ships the same 23.11 line the dev box runs, so a runner installs
  # it from the archive in seconds — no `scripts/dpdk/dpdk-setup.sh`, which
  # exists for hugepages and NIC binding rather than for building.
  #
  # `cargo check` rather than build or test: the value here is proving the
  # bindgen run and the feature-gated code still compile. Actually running
  # DPDK needs hugepages, a bound NIC, and root, none of which a hosted
  # runner has.
  dpdk:
    runs-on: ubuntu-latest
    # Two builds now, and the packaging one compiles eight crates from their
    # tarballs with a target directory rust-cache cannot warm (each package
    # builds under `target/package/`).
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Only the DPDK headers. bindgen needs libclang, but the runner image
      # already ships Clang 16/17/18 — installing `libclang-dev` on top of
      # that pulled a whole LLVM development tree and dominated the job.
      # If bindgen ever fails to find it, set LIBCLANG_PATH rather than
      # reinstalling the tree.
      #
      # This step pays full price every run. If it ever stops being seconds,
      # the DPDK check moves to Nightly — but the packaging step stays here,
      # since its whole value is gating an ordinary push, and it would then
      # need `--exclude melin-dpdk` and the coverage loss that implies.
      - name: Install DPDK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdpdk-dev

      - name: DPDK builds
        run: cargo check -p melin-server-runtime --all-targets --features dpdk --locked

      # Proves the workspace can still be packaged. Nothing else does: `cargo
      # check` compiles crates in place, while publishing builds each one from
      # a generated tarball in isolation, so it is the only thing that catches
      # a manifest that cannot ship — a path dependency missing its `version`,
      # an `exclude` that drops a file the build needs, a crate that compiles
      # only because a sibling's files happen to be next to it. `melin-dpdk`,
      # with a build script and a vendored C wrapper, is the member where that
      # last one is most likely, which is why this belongs in the job that can
      # build it rather than being run with `--exclude melin-dpdk`.
      #
      # On every push rather than at release time because that breakage
      # arrives with an ordinary commit, and the alternative is finding it
      # during a release, when the version is already tagged and half the
      # crates may already be on crates.io permanently.
      #
      # `scripts/publish.sh` rather than the cargo command directly, so CI
      # exercises the same script a release runs. Its default mode packages
      # and verifies every crate and uploads nothing, needing no crates.io
      # credentials and neither jq nor curl — the already-published filter is
      # on the `--execute` path only. It also enforces that CHANGELOG.md
      # describes the current version, which is why `CHANGELOG.md` is
      # deliberately absent from this workflow's `paths-ignore`.
      - name: Packaging dry run
        if: ${{ !cancelled() }}
        run: scripts/publish.sh

  # All four cargo-deny checks, configured in `deny.toml`. Advisories run
  # here as well as in Nightly on purpose: here they catch a dependency that
  # arrives already carrying a known problem, at the moment it is added
  # rather than up to a day later. Nightly covers the other direction — an
  # advisory published against a dependency that was clean when it landed.
  #
  # Needs no toolchain or cache: the action ships its own cargo-deny, and
  # the check resolves the dependency graph rather than compiling it.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
